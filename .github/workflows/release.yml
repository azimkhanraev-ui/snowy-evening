name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag must match the version in package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match version $version"
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run release -- --published
      - name: Install and uninstall the real installer
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/SnowyEvening-Setup.exe
            release/SnowyEvening-Portable.exe
            release/SHA256SUMS.txt
            release/version.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and update version.json
      actions: write # start the Pages workflow
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist-release
      - name: Verify checksums
        working-directory: dist-release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create the GitHub Release
        working-directory: dist-release
        run: |
          files=(SnowyEvening-Setup.exe SnowyEvening-Portable.exe SHA256SUMS.txt version.json)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes --verify-tag --latest
          fi
      - name: Update version.json in the repository
        # A protected branch may refuse the push. The site still gets the data from the release.
        continue-on-error: true
        run: |
          cp dist-release/version.json website/public/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/version.json
          git diff --cached --quiet && exit 0
          git commit -m "Update version.json for $TAG"
          git push origin "HEAD:$BRANCH"
      - name: Deploy the site
        # The github-pages environment rejects runs from tags, so start it on the default branch.
        run: gh workflow run pages.yml --ref "$BRANCH"
